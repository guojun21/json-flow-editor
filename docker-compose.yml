# json-flow-editor 的 pod。两件事和普通容器不一样:
#   1. 整个工程目录挂进去(/app),改代码不用重建镜像;在 pod 里改的东西也直接落宿主盘
#   2. 带 sshd,可以 `ssh jfe-pod` 直接进去干活(端口 4245 → 容器 22)
services:
  json-flow-editor:
    build: .
    image: json-flow-editor:latest
    container_name: json-flow-editor
    restart: unless-stopped
    environment:
      APP_UID: "1003"      # 服务以宿主用户身份跑,写出来的 JSON 属主正常
      APP_GID: "1003"
    ports:
      - "4244:4244"        # 网页
      - "4245:22"          # SSH 进 pod
    volumes:
      - .:/app                                              # 代码 + 数据,单一真源
      - ./.pod-ssh:/etc/ssh/keys                            # sshd host key,重启指纹不变
      - /home/guruicheng/.ssh/authorized_keys:/tmp/authorized_keys.host:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
